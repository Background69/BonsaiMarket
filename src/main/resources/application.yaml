spring:
  application:
    name: BonsaiMarket
  servlet:
    multipart:
      max-file-size: ${PRODUCT_IMAGE_MAX_BYTES:5242880}
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bonsai_market}
    username: ${DB_USERNAME:bonsai}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: lax
auth:
  otp-key: ${AUTH_OTP_HMAC_KEY:}
  mail-from: ${MAIL_FROM:}
  frontend-origin: ${AUTH_FRONTEND_ORIGIN:http://localhost:5173}
  public-origin: ${AUTH_PUBLIC_ORIGIN:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  facebook-client-id: ${FACEBOOK_CLIENT_ID:}
  facebook-client-secret: ${FACEBOOK_CLIENT_SECRET:}
  facebook-api-version: ${FACEBOOK_API_VERSION:}
marketplace:
  media:
    root: ${PRODUCT_IMAGE_ROOT:.local/product-images}
    max-bytes: ${PRODUCT_IMAGE_MAX_BYTES:5242880}
orders:
  mail:
    enabled: ${ORDER_MAIL_ENABLED:false}
shipping:
  ghn:
    # Fixed staging host in the adapter. No production shipping switch.
    enabled: ${SHIPPING_GHN_ENABLED:false}
    token: ${SHIPPING_GHN_TOKEN:}
    webhook-secret: ${SHIPPING_GHN_WEBHOOK_SECRET:}
    # Bind store IDs individually in server config: shipping.ghn.shop-ids.<storeId>=<ownedShopId>
    shop-ids: {}
    # Platform-reviewed staging COD accounts only; independent of order confirmation.
    cod-enabled-store-ids: []
ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
server:
  servlet:
    session:
      cookie:
        secure: ${AUTH_COOKIE_SECURE:false}
