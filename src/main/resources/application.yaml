spring:
  application:
    name: BonsaiMarket
  servlet:
    multipart:
      max-file-size: ${PRODUCT_IMAGE_MAX_BYTES:5242880}
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:bonsai}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:true}
      # Cổng 465 dùng MAIL_SMTP_SSL=true, MAIL_SMTP_STARTTLS=false; cổng 587 dùng mặc định.
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.ssl.protocols: TLSv1.2 TLSv1.3
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.debug: false
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: lax
auth:
  otp-key: ${AUTH_OTP_HMAC_KEY:}
  mail-from: ${MAIL_FROM:}
  frontend-origin: ${AUTH_FRONTEND_ORIGIN:http://localhost:5173}
  public-origin: ${AUTH_PUBLIC_ORIGIN:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  facebook-client-id: ${FACEBOOK_CLIENT_ID:}
  facebook-client-secret: ${FACEBOOK_CLIENT_SECRET:}
  facebook-api-version: ${FACEBOOK_API_VERSION:}
marketplace:
  media:
    root: ${PRODUCT_IMAGE_ROOT:.local/product-images}
    max-bytes: ${PRODUCT_IMAGE_MAX_BYTES:5242880}
orders:
  mail:
    enabled: ${ORDER_MAIL_ENABLED:false}
shipping:
  ghn:
    # Host staging cố định trong adapter; không có công tắc vận chuyển production.
    enabled: ${SHIPPING_GHN_ENABLED:false}
    token: ${SHIPPING_GHN_TOKEN:}
    webhook-secret: ${SHIPPING_GHN_WEBHOOK_SECRET:}
    # Gán từng gian hàng trong cấu hình server: shipping.ghn.shop-ids.<storeId>=<ownedShopId>
    shop-ids: {}
    # Chỉ tài khoản COD staging đã được platform duyệt, độc lập với xác nhận đơn.
    cod-enabled-store-ids: []
ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
vnpay:
  enabled: ${VNPAY_ENABLED:false}
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev
    # Profile dev tự nạp cấu hình riêng (SMTP, khóa OTP...) từ .env tại thư mục làm việc.
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    placeholders:
      devSeedPasswordHash: ${DEV_SEED_PASSWORD_HASH:}
server:
  servlet:
    session:
      cookie:
        secure: ${AUTH_COOKIE_SECURE:false}

---
spring:
  config:
    activate:
      on-profile: prod | production
  flyway:
    locations: classpath:db/migration
