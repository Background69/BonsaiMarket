spring:
  application:
    name: BonsaiMarket
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bonsai_market}
    username: ${DB_USERNAME:bonsai}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: lax
auth:
  otp-key: ${AUTH_OTP_HMAC_KEY:}
  mail-from: ${MAIL_FROM:}
  frontend-origin: ${AUTH_FRONTEND_ORIGIN:http://localhost:5173}
  public-origin: ${AUTH_PUBLIC_ORIGIN:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  facebook-client-id: ${FACEBOOK_CLIENT_ID:}
  facebook-client-secret: ${FACEBOOK_CLIENT_SECRET:}
  facebook-api-version: ${FACEBOOK_API_VERSION:}
ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
server:
  servlet:
    session:
      cookie:
        secure: ${AUTH_COOKIE_SECURE:false}
