spring:
  application:
    name: BonsaiMarket
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bonsai_market}
    username: ${DB_USERNAME:bonsai}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
app:
  auth:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:no-reply@bonsaimarket.local}
ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
management:
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
app:
  auth:
    log-links: true